<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Figure 2. Empirical support for the model by stage (168 worlds)</title><desc id="d">Stage 1 selection supported, stage 2 exercise contradicted for the main effect and suggestive for the moderation, stage 3 entrenchment no detectable effect.</desc><defs><marker id="m-pred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="m-sup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="m-rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="m-null" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="m-sug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m-inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="1080" height="640" fill="#fff"/><rect x="10" y="20" width="345" height="360" rx="8" fill="#f3f4f6" stroke="#c9ced6"/><text x="182.5" y="44" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="182.5" dy="0.0">Stage 1 · Selection: supported</tspan></text><rect x="10" y="432" width="345" height="140" rx="6" fill="#fff" stroke="#c9ced6"/><text x="20" y="452" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="20" dy="0.0">Results</tspan></text><text x="20" y="467" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="20" dy="0.0">No-candidate elections 55% → 34% with rents;</tspan><tspan x="20" dy="14.5">odds of standing ×1.7. Claude ≈ ¼ the odds of</tspan><tspan x="20" dy="14.5">DeepSeek; V4 Pro ×1.7 vs Flash. Winning once</tspan><tspan x="20" dy="14.5">standing: Claude 26 vs 25.6 expected; Pro</tspan><tspan x="20" dy="14.5">47 vs 38.4.</tspan></text><rect x="367" y="20" width="345" height="360" rx="8" fill="#f3f4f6" stroke="#c9ced6"/><text x="539.5" y="44" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="539.5" dy="0.0">Stage 2 · Exercise: contradicted</tspan></text><rect x="367" y="432" width="345" height="140" rx="6" fill="#fff" stroke="#c9ced6"/><text x="377" y="452" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="377" dy="0.0">Results</tspan></text><text x="377" y="467" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="377" dy="0.0">Gini 0.082 (binding) vs 0.108 (advisory); random</tspan><tspan x="377" dy="14.5">benchmark 0.103: sign reversed. Holders favored</tspan><tspan x="377" dy="14.5">agents with fewer tasks and less energy;</tspan><tspan x="377" dy="14.5">self-allocation −0.50. Rents × binding: 2.6 days,</tspan><tspan x="377" dy="14.5">p = 0.055 (suggestive).</tspan></text><rect x="724" y="20" width="345" height="360" rx="8" fill="#f3f4f6" stroke="#c9ced6"/><text x="896.5" y="44" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="896.5" dy="0.0">Stage 3 · Entrenchment: no effect</tspan></text><rect x="724" y="432" width="345" height="140" rx="6" fill="#fff" stroke="#c9ced6"/><text x="734" y="452" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="734" dy="0.0">Results</tspan></text><text x="734" y="467" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="734" dy="0.0">Election rule: Table 1 p ≥ 0.31 (re-election</tspan><tspan x="734" dy="14.5">0.32 vs 0.38). Holder spell 10.1 vs 10.4 days by</tspan><tspan x="734" dy="14.5">authority; 8.1 → 12.4 days with rents.</tspan><tspan x="734" dy="14.5">Mediation through candidacy not tested.</tspan></text><rect x="24.0" y="87.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="81.5" y="119.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="81.5" dy="0.0">Office rents</tspan></text><rect x="24.0" y="227.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="81.5" y="251.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="81.5" dy="0.0">Agent capability</tspan><tspan x="81.5" dy="15.0">or model family</tspan></text><rect x="226.0" y="84.0" width="115" height="62" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="283.5" y="111.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="283.5" dy="0.0">Candidacy and</tspan><tspan x="283.5" dy="15.0">electoral competition</tspan></text><rect x="226.0" y="227.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="283.5" y="251.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="283.5" dy="0.0">Winning once</tspan><tspan x="283.5" dy="15.0">standing</tspan></text><path d="M139.0,115 L226.0,115" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#m-sup)"/><text x="182.5" y="105" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4ed8"><tspan x="182.5" dy="0.0">P1 ✓</tspan></text><path d="M139.0,245 L226.0,135" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#m-sup)"/><text x="152.5" y="196" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4ed8" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="152.5" dy="0.0">P5 ✓ (stands)</tspan></text><path d="M139.0,255 L226.0,255" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-sug)"/><text x="176.5" y="278" font-size="12" text-anchor="middle" font-weight="bold" fill="#7c3aed"><tspan x="176.5" dy="0.0">P5 weak</tspan></text><rect x="381.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="438.5" y="199.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="438.5" dy="0.0">Authority binding</tspan></text><rect x="583.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="640.5" y="191.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="640.5" dy="0.0">Inequality of</tspan><tspan x="640.5" dy="15.0">access</tspan></text><path d="M496.0,195 L583.0,195" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#m-rev)"/><text x="539.5" y="222" font-size="12" text-anchor="middle" font-weight="bold" fill="#c2410c"><tspan x="539.5" dy="0.0">P2 ✕</tspan><tspan x="539.5" dy="14.0">(reversed)</tspan></text><rect x="482.0" y="73.0" width="115" height="44" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="539.5" y="99.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="539.5" dy="0.0">Office rents</tspan></text><path d="M539.5,117 L539.5,190" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-sug)"/><text x="549.5" y="150" font-size="12" text-anchor="start" font-weight="bold" fill="#7c3aed" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="549.5" dy="0.0">P3 suggestive</tspan></text><rect x="738.0" y="77.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="795.5" y="109.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="795.5" dy="0.0">Election rule</tspan></text><rect x="738.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="795.5" y="199.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="795.5" dy="0.0">Authority binding</tspan></text><rect x="738.0" y="257.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="795.5" y="289.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="795.5" dy="0.0">Office rents</tspan></text><rect x="940.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="997.5" y="191.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="997.5" dy="0.0">Persistence</tspan><tspan x="997.5" dy="15.0">of control</tspan></text><path d="M853.0,110 L940.0,185" fill="none" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-null)"/><text x="895.5" y="128" font-size="12" text-anchor="start" font-weight="bold" fill="#6b7280" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="895.5" dy="0.0">P4 n.s.</tspan></text><path d="M853.0,195 L940.0,195" fill="none" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-null)"/><text x="896.5" y="186" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b7280"><tspan x="896.5" dy="0.0">n.s.</tspan></text><path d="M853.0,280 L940.0,205" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#m-sup)"/><text x="899.5" y="277" font-size="12" text-anchor="start" font-weight="bold" fill="#1d4ed8" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="899.5" dy="0.0">✓ longer spells</tspan></text><path d="M341.0,115 L349,115 L349,404 L997.5,404 L997.5,223" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-inf)"/><text x="640.5" y="398" font-size="11.5" text-anchor="middle" font-weight="#6b7280" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="640.5" dy="0.0">Contest → persistence: inferred, mediation not tested</tspan></text><g font-size="11.5" fill="#111827"><line x1="12" y1="619" x2="46" y2="619" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#m-sup)"/><text x="54" y="623">Supported</text><line x1="140" y1="619" x2="174" y2="619" stroke="#c2410c" stroke-width="2.4" marker-end="url(#m-rev)"/><text x="182" y="623">Contradicted (sign reversed)</text><line x1="360" y1="619" x2="394" y2="619" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#m-null)"/><text x="402" y="623">No detectable effect</text><line x1="540" y1="619" x2="574" y2="619" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-sug)"/><text x="582" y="623">Weak / suggestive</text><line x1="700" y1="619" x2="734" y2="619" stroke="#9ca3af" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#m-inf)"/><text x="742" y="623">Inferred, not tested</text></g></svg>