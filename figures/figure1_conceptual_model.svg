<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Figure 1. Conceptual model and propositions in three stages</title><desc id="d">Selection (P1, P5), exercise (P2, P3) and entrenchment (P4), with capture-logic and specification-logic predictions per stage.</desc><defs><marker id="m-pred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="m-sup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="m-rev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="m-null" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="m-sug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m-inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="1080" height="640" fill="#fff"/><rect x="10" y="20" width="345" height="360" rx="8" fill="#f3f4f6" stroke="#c9ced6"/><text x="182.5" y="44" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="182.5" dy="0.0">Stage 1 · Selection (contest)</tspan></text><rect x="10" y="432" width="345" height="140" rx="6" fill="#fff" stroke="#c9ced6"/><text x="20" y="452" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="20" dy="0.0">Capture logic predicts</tspan></text><text x="20" y="467" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="20" dy="0.0">Rents and capability raise candidacy.</tspan></text><text x="20" y="491.5" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="20" dy="0.0">Specification logic predicts</tspan></text><text x="20" y="506.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="20" dy="0.0">The same (the logics agree).</tspan></text><rect x="367" y="20" width="345" height="360" rx="8" fill="#f3f4f6" stroke="#c9ced6"/><text x="539.5" y="44" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="539.5" dy="0.0">Stage 2 · Exercise (capture)</tspan></text><rect x="367" y="432" width="345" height="140" rx="6" fill="#fff" stroke="#c9ced6"/><text x="377" y="452" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="377" dy="0.0">Capture logic predicts</tspan></text><text x="377" y="467" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="377" dy="0.0">Binding authority raises inequality of</tspan><tspan x="377" dy="14.5">access; rents amplify the effect.</tspan></text><text x="377" y="506.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="377" dy="0.0">Specification logic predicts</tspan></text><text x="377" y="521.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="377" dy="0.0">No increase and no amplification</tspan><tspan x="377" dy="14.5">(equity default).</tspan></text><rect x="724" y="20" width="345" height="360" rx="8" fill="#f3f4f6" stroke="#c9ced6"/><text x="896.5" y="44" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="896.5" dy="0.0">Stage 3 · Entrenchment (persistence)</tspan></text><rect x="724" y="432" width="345" height="140" rx="6" fill="#fff" stroke="#c9ced6"/><text x="734" y="452" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="734" dy="0.0">Capture logic predicts</tspan></text><text x="734" y="467" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="734" dy="0.0">Ranked-choice shortens persistence.</tspan></text><text x="734" y="491.5" font-size="11.5" text-anchor="start" font-weight="bold" fill="#111827"><tspan x="734" dy="0.0">Specification logic predicts</tspan></text><text x="734" y="506.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#111827"><tspan x="734" dy="0.0">No effect unless agents reason about</tspan><tspan x="734" dy="14.5">coalitions (limited strategic depth).</tspan></text><rect x="24.0" y="87.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="81.5" y="119.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="81.5" dy="0.0">Office rents</tspan></text><rect x="24.0" y="227.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="81.5" y="251.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="81.5" dy="0.0">Agent capability</tspan><tspan x="81.5" dy="15.0">or model family</tspan></text><rect x="226.0" y="154.0" width="115" height="62" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="283.5" y="181.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="283.5" dy="0.0">Candidacy and</tspan><tspan x="283.5" dy="15.0">electoral competition</tspan></text><path d="M139.0,115 L226.0,170" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#m-pred)"/><text x="174.5" y="127" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="174.5" dy="0.0">P1 (+)</tspan></text><path d="M139.0,255 L226.0,200" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#m-pred)"/><text x="174.5" y="247" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="174.5" dy="0.0">P5 (+)</tspan></text><rect x="381.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="438.5" y="199.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="438.5" dy="0.0">Authority binding</tspan></text><rect x="583.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="640.5" y="191.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="640.5" dy="0.0">Inequality of</tspan><tspan x="640.5" dy="15.0">access</tspan></text><path d="M496.0,195 L583.0,195" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#m-pred)"/><text x="539.5" y="222" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="539.5" dy="0.0">P2 (+)</tspan></text><rect x="482.0" y="73.0" width="115" height="44" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="539.5" y="99.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="539.5" dy="0.0">Office rents</tspan></text><path d="M539.5,117 L539.5,192" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-sug)"/><text x="549.5" y="150" font-size="12" text-anchor="start" font-weight="bold" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="549.5" dy="0.0">P3 (moderates, +)</tspan></text><rect x="738.0" y="164.0" width="115" height="62" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="795.5" y="184.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="795.5" dy="0.0">Election rule</tspan><tspan x="795.5" dy="15.0">(ranked-choice vs</tspan><tspan x="795.5" dy="15.0">plurality)</tspan></text><rect x="940.0" y="167.0" width="115" height="56" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/><text x="997.5" y="191.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827"><tspan x="997.5" dy="0.0">Persistence</tspan><tspan x="997.5" dy="15.0">of control</tspan></text><path d="M853.0,195 L940.0,195" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#m-pred)"/><text x="896.5" y="222" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827"><tspan x="896.5" dy="0.0">P4 (−)</tspan></text><path d="M283.5,216 L283.5,404 L997.5,404 L997.5,223" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-inf)"/><text x="640.5" y="398" font-size="11.5" text-anchor="middle" font-weight="#6b7280" fill="#111827" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="640.5" dy="0.0">Contest → persistence: inferred, not estimated</tspan></text><g font-size="11.5" fill="#111827"><line x1="12" y1="619" x2="52" y2="619" stroke="#1f2937" stroke-width="2.2" marker-end="url(#m-pred)"/><text x="60" y="623">Main-effect proposition (sign = capture-logic prediction)</text><line x1="420" y1="619" x2="460" y2="619" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-sug)"/><text x="468" y="623">Moderation</text><line x1="580" y1="619" x2="620" y2="619" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-inf)"/><text x="628" y="623">Inferred path (not tested)</text></g></svg>